workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60

    integrations:
      app_store_connect: Codemagic Yendo

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.yendo.yendoo

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Build iOS IPA
        script: flutter build ipa --release -t lib/main.dart --export-options-plist=/Users/builder/export_options.plist

      - name: Find IPA
        script: |
          echo "Buscando archivos IPA..."
          find $CM_BUILD_DIR -type f -name "*.ipa" -print

    artifacts:
      - build/ios/ipa/*.ipa
      - "**/*.ipa"
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
